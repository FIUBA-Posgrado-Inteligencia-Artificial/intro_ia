[project]
name = "intro-ia"
version = "0.1.0"
description = "Material de clases para Inteligencia Artificial (CEIA - FIUBA)."
authors = ["Facundo Adrián Lucianna <facundolucianna@gmail.com>"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "jupyterlab>=4.4.3",
    "matplotlib>=3.10.3",
    "numpy>=2.2.6",
    "pandas>=2.2.3",
    "plotly>=7.1.0",
    "pyarrow>=20.0.0",
    "pygame>=2.6.1",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
    "vizdoom>=1.2.4",
]

[dependency-groups]
dev = [
    "pymupdf>=1.27.1",
    "shapely>=2.2.0",
]

[tool.ty.environment]
extra-paths = [
    "clase2/content/hanoi_tower",
    "clase2/content/hanoi_tower/simulator",
    "clase2/exercise",
    "clase3/content/gira",
    "clase7/viz-doom",
]

# Notebooks de ejercicios con huecos intencionales para los alumnos
# (placeholders `...`, `___`, `# COMPLETAR`) y material temporario de trabajo.
[tool.ty.src]
exclude = [
    "_TEMP_sudoku",
    "clase1/content/ejercicios",
    "clase2/exercise/exercise_2.ipynb",
    "clase3/exercise/aproximando_la_fiuba.ipynb",
    "clase5/exercise/swiss_reg.ipynb",
    "clase6/exercise/spam.ipynb",
]

[tool.pyright]
extraPaths = [
    "clase2/content/hanoi_tower",
    "clase2/content/hanoi_tower/simulator",
    "clase2/exercise",
    "clase3/content/gira",
    "clase7/viz-doom",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "PL"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

